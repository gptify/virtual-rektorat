name: Deploy to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@3with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
